const W = D.w, H = D.h;
const raw = Uint8Array.from(atob(D.colors), c => c.charCodeAt(0));
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const CW = 8, CH = 14;
cv.width = W * CW; cv.height = H * CH + 44;
const GROW = 7000, TURN = 5000;
let start = performance.now();
document.getElementById('again').onclick = () => { start = performance.now(); };

function colormap(theta){
  const cx = (W - 1) / 2;
  let c = Math.cos(theta);
  if (Math.abs(c) < 0.22) c = c >= 0 ? 0.22 : -0.22;
  const src = new Int32Array(W), shade = new Float32Array(W);
  for (let gx = 0; gx < W; gx++){
    const sx = Math.round(cx + (gx - cx) / c);
    src[gx] = (sx >= 0 && sx < W) ? sx : -1;
    let s = (0.55 + 0.45 * Math.abs(c)) * (0.85 + 0.15 * Math.sin(theta + (gx / W) * Math.PI));
    shade[gx] = Math.max(0.30, Math.min(1.05, s));
  }
  return [src, shade];
}

function frame(now){
  const t = now - start;
  const progress = Math.min(1, t / GROW);
  const theta = progress >= 1 ? (t - GROW) * 2 * Math.PI / TURN : 0;
  const [src, shade] = colormap(theta);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.font = 'bold 13px monospace';
  ctx.textBaseline = 'top';
  const tick = Math.floor(t / 110);
  // estrellitas
  if (progress >= 1){
    ctx.fillStyle = 'rgb(120,120,140)';
    let seed = 42 + Math.floor(tick / 6);
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    for (let i = 0; i < 16; i++){
      ctx.fillText(rnd() < 0.5 ? '.' : '*', Math.floor(rnd() * W) * CW, Math.floor(rnd() * H) * CH);
    }
  }
  for (let gy = 0; gy < H; gy++){
    const row = D.chars[gy];
    for (let gx = 0; gx < W; gx++){
      const sx = src[gx];
      if (sx < 0) continue;
      const idx = gy * W + sx;
      if (progress < 1 && D.reveal[idx] > progress) continue;
      const ch = row[sx];
      if (ch === ' ') continue;
      const r = Math.min(255, raw[idx*3] * shade[gx]) | 0;
      const g = Math.min(255, raw[idx*3+1] * shade[gx]) | 0;
      const b = Math.min(255, raw[idx*3+2] * shade[gx]) | 0;
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      ctx.fillText(ch, gx * CW, gy * CH);
    }
  }
  // petalos cayendo
  if (progress >= 1){
    const cols = ['rgb(255,140,190)','rgb(255,110,160)','rgb(255,190,220)'];
    for (let i = 0; i < 9; i++){
      const span = H + 14;
      const py = ((tick * (1 + i % 3) + i * 17) % span) - 7;
      const px = (i * 37 + Math.floor(6 * Math.sin(tick / 3 + i))) % W;
      if (py >= 0 && py < H){
        ctx.fillStyle = cols[i % 3];
        ctx.fillText('\u2022', px * CW, py * CH);
      }
    }
    const msg = 'MELANIE';
    const n = Math.min(msg.length, Math.floor((t - GROW) / 160));
    if (n > 0){
      ctx.font = 'bold 26px monospace';
      ctx.fillStyle = 'rgb(255,130,180)';
      const txt = msg.slice(0, n);
      ctx.fillText(txt, (cv.width - ctx.measureText(msg).width) / 2, H * CH + 8);
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
